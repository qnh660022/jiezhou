<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="旅途助手 Web 版：行程规划 + 出行清单 + AA 记账（纯本地离线，数据仅存本浏览器）">

  <!-- Viewport / mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="旅途助手">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#2E7D5B">
  <title>旅途助手</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 首屏加载提示（Flutter 就绪前）——默认可见，仅桌面生效 */
    html, body { margin: 0; padding: 0; height: 100%; background: #F7FBF8; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, sans-serif; color: #5A5F5A;
    }
    #boot .logo { font-size: 40px; }
    #boot .bar {
      width: 120px; height: 4px; border-radius: 99px; overflow: hidden;
      background: #E3E8E2;
    }
    #boot .bar > i {
      display: block; height: 100%; width: 40%;
      border-radius: 99px; background: #2E7D5B;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    #boot.hidden { opacity: 0; transition: opacity .3s; }
    flutter-view { width: 100%; height: 100%; }

    /* 手机端拦截页：默认隐藏，窄屏命中时显示（不加载 Flutter 引擎） */
    #mobile-gate {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: #F7FBF8; padding: 32px;
      font-family: system-ui, -apple-system, sans-serif; color: #5A5F5A;
    }
    #mobile-gate .card { max-width: 420px; text-align: center; }
    #mobile-gate .icon {
      width: 72px; height: 72px; margin: 0 auto; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 34px;
      background: linear-gradient(135deg, #2E7D5B, #14532D);
    }
    #mobile-gate h1 { font-size: 19px; font-weight: 800; color: #1C1F1C; margin: 24px 0 12px; }
    #mobile-gate p { font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
    #mobile-gate a.btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 999px; text-decoration: none;
      background: #2E7D5B; color: #fff; font-size: 15px; font-weight: 600;
    }

    /*
     * 关键：用纯 CSS 媒体查询控制首屏可见性（与 JS 的 <1024、Flutter 侧
     * MediaQuery <1024 同口径，取 1023px 即窄于 1024）。CSS 在首帧绘制前
     * 就已生效，手机端从第一像素起就只显示拦截页，彻底杜绝
     * 「旅途助手加载中…」先闪现、拦截页后出现的时序问题。
     */
    @media (max-width: 1023px) {
      #mobile-gate { display: flex; }
      #boot { display: none; }
    }
  </style>
</head>
<body>
  <!-- 手机端拦截页：可见性由 CSS 媒体查询决定（窄屏显示，不加载 Flutter 引擎） -->
  <div id="mobile-gate">
    <div class="card">
      <div class="icon">📱</div>
      <h1>Web 版暂不支持手机端访问</h1>
      <p>请使用电脑浏览器访问，<br>或前往官网下载 APK 安装到手机。</p>
      <a class="btn" href="https://jiezhou.22006.dpdns.org/" target="_blank" rel="noopener">前往官网下载 APK</a>
    </div>
  </div>

  <div id="boot">
    <div class="logo">🧳</div>
    <div>旅途助手加载中…</div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // 启动分流（可见性已由上方 CSS 媒体查询保证首帧即正确）：
    // 窄屏（<1024，与 CSS/Flutter 侧口径一致）直接拦截，不加载 Flutter 引擎，
    // 手机端零引擎下载；这里只负责「不引导 engine」与收尾清理。
    (function () {
      if (window.innerWidth < 1024) {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        return;
      }
      // 桌面端：正常引导 Flutter
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
      // Flutter render 后隐藏首屏提示
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('boot');
        if (el) { el.classList.add('hidden'); setTimeout(function(){ el.remove(); }, 350); }
      });
      setTimeout(function () { var el = document.getElementById('boot'); if (el) el.remove(); }, 15000);
    })();
  </script>
</body>
</html>
